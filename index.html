<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="index.css" />
        <title>Recap</title>
    </head>
    <body>
        <div class="header">
            <div class="header-content">
                <a href="#">Recap</a>
                <div class="menu">
                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#contact">Contact Us</a>
                </div>
            </div>
        </div>

        <div class="hero">
            <div class="hero-message">
                Cortes de cabelo de exelente qualidade
            </div>
            <div class="portfolio">
                <img
                    src="./images/37 Cool Slicked Back Hairstyles For Men_ A Barber's Styling Guide.jfif"
                    alt=""
                />
                <img src="./images/download (1).jfif" alt="cabelo" />
                <img src="images/download (2).jfif" alt="cabelo" />
                <img src="images/download (3).jfif" alt="cabelo" />
                <img src="images/download (4).jfif" alt="cabelo" />
                <img src="images/ig_ @chavacore1.jfif" alt="cabelo" />
                <img src="./images/Hair.jfif" alt="cabelo" />
                <img
                    src="./images/Cabelo Masculino Topete Pompadour.jfif"
                    alt="cabelo"
                />
                <img src="./images/high fade.jfif" alt="cabelo" />
            </div>
        </div>

        <div class="contact-us">
            <div class="message">
                <h2>Contact Us</h2>
                <p>
                    segue abaixo links para tudo venha deixar o seu cabelo de
                    cruel
                </p>
            </div>
            <div class="contact" id="contact">
                <i class="fa-brands fa-whatsapp"></i>
                <i class="fa-brands fa-youtube"></i>
                <i class="fa-brands fa-tiktok"></i>
                <i class="fa-brands fa-pinterest"></i>
            </div>
        </div>

        <div class="rating">
            <h2>Avalia nois vamooooooooooooooooooo</h2>
            <div class="stars">
                <button
                    type="button"
                    class="star"
                    data-rating="1"
                    aria-label="1 star"
                >
                    <i class="fa-solid fa-star" aria-hidden="true"></i>
                </button>
                <button
                    type="button"
                    class="star"
                    data-rating="2"
                    aria-label="2 star"
                >
                    <i class="fa-solid fa-star" aria-hidden="true"></i>
                </button>
                <button
                    type="button"
                    class="star"
                    data-rating="3"
                    aria-label="3 star"
                >
                    <i class="fa-solid fa-star" aria-hidden="true"></i>
                </button>
                <button
                    type="button"
                    class="star"
                    data-rating="4"
                    aria-label="4 star"
                >
                    <i class="fa-solid fa-star" aria-hidden="true"></i>
                </button>
                <button
                    type="button"
                    class="star"
                    data-rating="5"
                    aria-label="5 star"
                >
                    <i class="fa-solid fa-star" aria-hidden="true"></i>
                </button>
            </div>
            <h3 class="message">lets go</h3>
        </div>

        <!-- <div class="pseudo-before-after">
            <h3>pseudo after and before</h3>
        </div> -->

        <form class="form">
            <div>
                <label for="name">Nome:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="digite seu nome"
                    required
                />
            </div>
            <!-- email -->
            <div>
                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="digite seu email"
                    required
                />
            </div>
            <!-- data -->
            <div>
                <label for="name">Data:</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    placeholder="digite seu nome"
                    required
                />
            </div>
            <!-- corte -->
            <div>
                <input
                    type="text"
                    id="haircut"
                    name="haircut"
                    list="haircuts"
                    placeholder="escolha seu corte ou digite um"
                    required
                />

                <datalist id="haircuts">
                    <option value="low fade"></option>
                    <option value="degradê"></option>
                    <option value="mod cut"></option>
                    <option value="low taper"></option>
                    <option value="jit fade"></option>
                    <option value="social"></option>
                </datalist>
            </div>

            <div>
                <label for="message">Mensagem:</label>
                <textarea name="message" id="message"></textarea>
            </div>
            <button class="btn">Submit</button>
        </form>

        <script src="script.js"></script>
    </body>
</html>
